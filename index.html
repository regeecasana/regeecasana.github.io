<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authentication - IxWisdom</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #fafafa;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: #333;
      }

      .container {
        text-align: center;
        max-width: 360px;
        width: 90%;
      }

      .logo {
        font-size: 20px;
        font-weight: 600;
        color: #171717;
        margin-bottom: 32px;
        letter-spacing: -0.3px;
      }

      .status.success {
        color: #22c55e;
      }

      .status.error {
        color: #ef4444;
      }

      .icon {
        font-size: 40px;
        margin-bottom: 16px;
      }

      .message {
        font-size: 15px;
        line-height: 1.6;
        color: #525252;
        margin-bottom: 8px;
      }

      .detail {
        font-size: 13px;
        color: #a3a3a3;
      }

      .spinner {
        border: 2px solid #e5e5e5;
        border-top: 2px solid #171717;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .error-details {
        background: #fef2f2;
        border-left: 3px solid #ef4444;
        padding: 12px;
        margin-top: 16px;
        text-align: left;
        font-size: 12px;
        color: #991b1b;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">IxWisdom</div>
      <div id="content">
        <div class="spinner"></div>
        <p class="message">Processing authentication...</p>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        // Configuration
        const CONFIG = {
          AUTO_CLOSE_DELAY: 2000, // 2 seconds
          MESSAGE_TYPE: "AZURE_B2C_CALLBACK",
        };

        /**
         * Parse URL parameters from the current location
         */
        function getUrlParams() {
          const params = new URLSearchParams(window.location.search);
          return {
            code: params.get("code"),
            state: params.get("state"),
            error: params.get("error"),
            error_description: params.get("error_description"),
          };
        }

        /**
         * Update the UI with status
         */
        function updateUI(status, icon, message, detail = "") {
          const content = document.getElementById("content");
          const statusClass = status === "success" ? "success" : "error";

          let html = `
                    <div class="status ${statusClass}">
                        <div class="icon">${icon}</div>
                        <p class="message">${message}</p>
                `;

          if (detail) {
            html += `<p class="detail">${detail}</p>`;
          }

          html += "</div>";
          content.innerHTML = html;
        }

        /**
         * Show error details
         */
        function showErrorDetails(error, description) {
          const content = document.getElementById("content");
          content.innerHTML += `
                    <div class="error-details">
                        <strong>Error:</strong> ${error}<br>
                        ${description ? `<strong>Details:</strong> ${description}` : ""}
                    </div>
                `;
        }

        /**
         * Send message to parent window (Zendesk app)
         * Allows all origins but logs them for monitoring
         */
        function sendMessageToParent(payload) {
          if (!window.opener) {
            console.error("No window.opener found");
            updateUI(
              "error",
              "×",
              "Authentication window error",
              "This window was not opened correctly. Please try again."
            );
            return false;
          }

          // Get the opener's origin for logging
          let openerOrigin;
          try {
            openerOrigin = window.opener.location.origin;
          } catch (err) {
            // Cross-origin - can't access opener.location
            openerOrigin = "cross-origin (inaccessible)";
          }

          // Log the origin for monitoring and debugging
          console.log("[OAuth Callback] Sending message to origin:", openerOrigin);
          console.log("[OAuth Callback] Payload:", payload);

          // Send message to ANY origin (allowing all)
          try {
            window.opener.postMessage(payload, "*");
            console.log("[OAuth Callback] Message sent successfully");
            return true;
          } catch (err) {
            console.error("[OAuth Callback] Failed to send message:", err);
            updateUI("error", "×", "Communication error", "Failed to send authentication result.");
            return false;
          }
        }

        /**
         * Handle OAuth callback
         */
        function handleOAuthCallback() {
          const params = getUrlParams();

          // Check for Azure B2C errors
          if (params.error) {
            const payload = {
              type: CONFIG.MESSAGE_TYPE,
              success: false,
              error: params.error,
              error_description: params.error_description || "Authentication failed",
            };

            updateUI("error", "×", "Authentication failed", "Unable to complete authentication.");
            showErrorDetails(params.error, params.error_description);

            sendMessageToParent(payload);

            // Don't auto-close on error - let user read the message
            return;
          }

          // Check for authorization code
          if (!params.code) {
            const payload = {
              type: CONFIG.MESSAGE_TYPE,
              success: false,
              error: "missing_code",
              error_description: "No authorization code received from Azure B2C",
            };

            updateUI("error", "×", "Invalid response", "No authorization code received.");

            sendMessageToParent(payload);
            return;
          }

          // Success - send code and state to parent
          const payload = {
            type: CONFIG.MESSAGE_TYPE,
            success: true,
            code: params.code,
            state: params.state || null,
          };

          const sent = sendMessageToParent(payload);

          if (sent) {
            updateUI("success", "✓", "Authentication successful", "Closing window...");

            // Auto-close after delay
            setTimeout(() => {
              try {
                window.close();
              } catch (err) {
                console.warn("Could not auto-close window:", err);
                updateUI("success", "✓", "Authentication complete", "You can close this window now.");
              }
            }, CONFIG.AUTO_CLOSE_DELAY);
          }
        }

        /**
         * Initialize on page load
         */
        function init() {
          // Validate that this page is opened in a popup context
          if (!window.opener) {
            updateUI("error", "!", "Invalid context", "This page must be opened from the IxWisdom app.");
            return;
          }

          // Handle the OAuth callback
          handleOAuthCallback();
        }

        // Run when DOM is ready
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
      console.log('Hello world')
    </script>
  </body>
</html>
